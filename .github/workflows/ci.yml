name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Skills
        run: .claude/scripts/skill-check.sh

      - name: Create .env
        run: |
          cp .env.dist .env
          sed -i \
            -e "s/^USER_ID=.*/USER_ID=$(id -u)/" \
            -e "s/^GROUP_ID=.*/GROUP_ID=$(id -g)/" \
            -e "s/^XDEBUG_MODE=.*/XDEBUG_MODE=off/" \
            .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the PHP image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: etc/infrastructure
          file: etc/infrastructure/php.Dockerfile
          tags: vending-machine.test-php-fpm
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # nginx, Traefik and Swagger UI are not needed: the checks run on the console and the kernel.
      # A service that a later check needs (mongo, in its compose profile) is added to this command.
      - name: Start the services
        run: docker compose up -d --no-build --wait php-fpm mysql

      - name: Install the dependencies
        run: make install

      - name: Validate composer.json and composer.lock
        run: docker compose exec -T php-fpm composer validate --no-check-publish --no-check-all

      - name: Migrate the databases
        run: make migrate

      - name: Coding standard
        run: make cs-check

      - name: Container lint
        run: make lint-container

      - name: PHPStan
        run: make phpstan

      - name: Layer dependencies (deptrac)
        run: make deptrac

      - name: Tests
        run: make test

      - name: Show the container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
