name: Start the project
description: Build the PHP image from the layer cache, start the given services and install the dependencies.

inputs:
  services:
    description: The compose services to start, such as "php-fpm" or "php-fpm mysql mongo".
    required: true
  dependencies:
    description: '"--no-deps" starts only the services given, without the ones they depend on.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create .env
      shell: bash
      run: |
        cp .env.dist .env
        sed -i \
          -e "s/^USER_ID=.*/USER_ID=$(id -u)/" \
          -e "s/^GROUP_ID=.*/GROUP_ID=$(id -g)/" \
          -e "s/^XDEBUG_MODE=.*/XDEBUG_MODE=off/" \
          .env

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Load the PHP image from the cache
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: etc/infrastructure
        file: etc/infrastructure/php.Dockerfile
        tags: vending-machine.test-php-fpm
        load: true
        cache-from: type=gha

    - name: Restore the dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: vendor-${{ hashFiles('composer.lock') }}

    - name: Start the services
      shell: bash
      run: docker compose up -d --no-build --wait ${{ inputs.dependencies }} ${{ inputs.services }}

    - name: Install the dependencies
      shell: bash
      run: make install

    # The tests' bootstrap would create them too; doing it here gives every job, the ones that only
    # boot the kernel included, the keys that sign and check the technicians' tokens.
    - name: Create the JWT key pair
      shell: bash
      run: make jwt-keys
