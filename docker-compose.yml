services:
  php-fpm:
    build:
      context: etc/infrastructure
      dockerfile: php.Dockerfile
    image: ${PROJECT_HOSTNAME}-php-fpm
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      - HOME=/tmp
      - PROJECT_HOSTNAME=${PROJECT_HOSTNAME}
      - PHP_IDE_CONFIG=serverName=${PROJECT_HOSTNAME}
      - PHP_XDEBUG_MODE=${XDEBUG_MODE:-off}
    working_dir: /var/www
    volumes:
      - "./:/var/www"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: "mysql:${MYSQL_VERSION:-8.4.13}"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./etc/infrastructure/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  default:
    name: vending_machine_network

volumes:
  mysql-data:
