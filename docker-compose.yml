services:
  php-fpm:
    build:
      context: etc/infrastructure
      dockerfile: php.Dockerfile
    image: ${PROJECT_HOSTNAME}-php-fpm
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      - HOME=/tmp
      - PROJECT_HOSTNAME=${PROJECT_HOSTNAME}
      - PHP_IDE_CONFIG=serverName=${PROJECT_HOSTNAME}
      - PHP_XDEBUG_MODE=${XDEBUG_MODE:-off}
    working_dir: /var/www
    volumes:
      - "./:/var/www"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: "mysql:${MYSQL_VERSION:-8.4.13}"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=app
      - MYSQL_USER=app
      - MYSQL_PASSWORD=app
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./etc/infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  default:
    name: vending_machine_network

volumes:
  mysql-data:
