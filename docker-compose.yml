services:
  php-fpm:
    build:
      context: etc/infrastructure
      dockerfile: php.Dockerfile
    image: ${PROJECT_HOSTNAME}-php-fpm
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      - HOME=/tmp
      - PROJECT_HOSTNAME=${PROJECT_HOSTNAME}
      - PHP_IDE_CONFIG=serverName=${PROJECT_HOSTNAME}
      - PHP_XDEBUG_MODE=${XDEBUG_MODE:-off}
    working_dir: /var/www
    volumes:
      - "./:/var/www"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  nginx:
    image: "nginx:${NGINX_VERSION:-1.30.6-alpine}"
    environment:
      - PROJECT_HOSTNAME=${PROJECT_HOSTNAME}
      - NGINX_ENVSUBST_FILTER=^PROJECT_HOSTNAME$$
    volumes:
      - ./etc/infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ./etc/infrastructure/certs:/etc/nginx/ssl:ro
      - ./public:/var/www/public:ro
    depends_on:
      - php-fpm
    labels:
      - traefik.enable=true
      - traefik.http.routers.vending-machine.rule=Host(`${PROJECT_HOSTNAME}`)
      - traefik.http.routers.vending-machine.entrypoints=https
      - traefik.http.routers.vending-machine.tls=true
      - traefik.http.routers.vending-machine.middlewares=vending-machine-cors
      - traefik.http.services.vending-machine.loadbalancer.server.port=443
      - traefik.http.services.vending-machine.loadbalancer.server.scheme=https
      - traefik.http.services.vending-machine.loadbalancer.serverstransport=nginx@file
      # Only Swagger UI, served from its own subdomain, may call the API from a browser.
      - traefik.http.middlewares.vending-machine-cors.headers.accesscontrolalloworiginlist=https://docs.${PROJECT_HOSTNAME}
      - traefik.http.middlewares.vending-machine-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS
      - traefik.http.middlewares.vending-machine-cors.headers.accesscontrolallowheaders=Content-Type
      - traefik.http.middlewares.vending-machine-cors.headers.accesscontrolmaxage=600
      - traefik.http.middlewares.vending-machine-cors.headers.addvaryheader=true

  swagger-ui:
    image: "swaggerapi/swagger-ui:${SWAGGER_UI_VERSION:-v5.34.1}"
    environment:
      - SWAGGER_JSON=/spec/openapi.yaml
    volumes:
      - ./docs:/spec:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.swagger-ui.rule=Host(`docs.${PROJECT_HOSTNAME}`)
      - traefik.http.routers.swagger-ui.entrypoints=https
      - traefik.http.routers.swagger-ui.tls=true
      - traefik.http.services.swagger-ui.loadbalancer.server.port=8080

  traefik:
    image: "traefik:${TRAEFIK_VERSION:-v3.7.18}"
    command:
      - --global.sendAnonymousUsage=false
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=vending_machine_network
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=:${TRAEFIK_HTTPS_PORT:-443}
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./etc/infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./etc/infrastructure/certs:/etc/certs:ro
    depends_on:
      - nginx

  mysql:
    image: "mysql:${MYSQL_VERSION:-8.4.13}"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./etc/infrastructure/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: "mongo:${MONGO_VERSION:-9.0.8}"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  default:
    name: vending_machine_network

volumes:
  mysql-data:
  mongo-data:
