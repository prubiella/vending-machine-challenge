schema_version: "1.1"
name: spec-catches-subtle-violations
expected_outcome: |
  Reviews a domain change (local tag eval/spec-v2) that adds Coin, Product, CoinStock and
  ExactChangeNotAvailable, against files/statement.md. Most of it matches the statement; three
  details do not: Soda is priced at 155 cents instead of 150, CoinStock::giveChange works on a
  copy of the counts, so the coins it gives never leave the stock, and it takes the largest coins
  first without backtracking, so it refuses change the stock could give. A good review finds all
  three, ties each to the statement, and does not flag the parts that do match. eval/spec-v2 is a
  tag, so the review checks no branch name and does not call it a branch.
context:
  scaffold_script: place-files.sh
