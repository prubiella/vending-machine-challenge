# Scheduler drops the weekend slots itself before it calls the picker, so the picker never sees
# them: the rule about which slots may be taken sits in the caller instead of in the class that
# decides which slot to take. It also takes a timezone that nothing reads (the defects planted in
# the tag eval/design-v1). The expected text names the misplaced rule, so the unused parameter
# alone does not pass the test. Minor counts: the lens reports Minor by default.
LENS=design
RANGE=eval/design-v1~1...eval/design-v1
EXPECT_FILE='src/Shared/Infrastructure/Scheduling/Scheduler.php'
EXPECT_TEXT='weekend|picker'
EXPECT_SEVERITY='Important|Minor'
