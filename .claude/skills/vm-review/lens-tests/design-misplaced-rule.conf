# RowExporter leaves archived rows out itself, a rule that belongs to the row selection and not to
# the class that only joins formatted rows, and takes a locale that nothing reads (the defects
# planted in the tag eval/design-v1). The expected text names either one, so a finding about the
# formatter interface alone does not pass the test. Minor counts: the lens reports Minor by default.
LENS=design
RANGE=eval/design-v1~1...eval/design-v1
EXPECT_FILE='src/Shared/Infrastructure/Export/RowExporter.php'
EXPECT_TEXT='archived|locale|filter'
EXPECT_SEVERITY='Important|Minor'
