# PaginationTest checks the defaults and the limits but never offset(), which is why the off-by-one
# of the same tag passes the suite. The bug itself belongs to the correctness lens, so the expected
# text names the missing test, not the wrong offset.
LENS=tests
RANGE=eval/generic-v1~1...eval/generic-v1
EXPECT_FILE='tests/Unit/Shared/Infrastructure/Http/PaginationTest.php|src/Shared/Infrastructure/Http/Pagination.php'
EXPECT_TEXT='offset.. has no test|offset.? is (not|never) tested|offset.? is untested|no test (calls|covers|checks|for) .?offset|never calls .?offset|nothing in paginationtest calls'
