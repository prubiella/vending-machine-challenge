# The pre-commit hook pipes the checks into tee under bash -e without pipefail, so a failing check
# no longer stops the commit (the planted defect of the eval case tooling-silent-failure).
LENS=silent-failures
RANGE=eval/tooling-v1~1...eval/tooling-v1
EXPECT_FILE='etc/git/hooks-docker/pre-commit'
EXPECT_TEXT='pipefail|tee'
