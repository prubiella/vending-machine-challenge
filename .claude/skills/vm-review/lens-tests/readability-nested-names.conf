# IntervalMerger::run nests four levels in one method and names its input, its result and its
# helper variables with single letters (the defects planted in the tag eval/readability-v1). The
# merge itself is correct, so a finding must be about how it reads.
LENS=readability
RANGE=eval/readability-v1~1...eval/readability-v1
EXPECT_FILE='src/Shared/Infrastructure/Range/IntervalMerger.php'
EXPECT_TEXT='nest|name|single.letter|cryptic|vague|abbreviat|intent'
EXPECT_SEVERITY='Important|Minor'
