# Pagination::offset multiplies the page by the page size, so page 1 starts at the second page and
# the first items are never listed (an off-by-one planted in the tag eval/generic-v1). The expected
# text names that mistake, so another finding about offset() does not pass the test.
LENS=correctness
RANGE=eval/generic-v1~1...eval/generic-v1
EXPECT_FILE='src/Shared/Infrastructure/Http/Pagination.php'
EXPECT_TEXT='page - 1|first page|skips? the first|off.by.one'
