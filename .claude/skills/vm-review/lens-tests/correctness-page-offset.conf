# Pagination::offset multiplies the page by the page size, so page 1 starts at the second page and
# the first items are never listed (an off-by-one planted in the tag eval/generic-v1).
LENS=correctness
RANGE=eval/generic-v1~1...eval/generic-v1
EXPECT_FILE='src/Shared/Infrastructure/Http/Pagination.php'
EXPECT_TEXT='offset|page - 1|first page|skip'
