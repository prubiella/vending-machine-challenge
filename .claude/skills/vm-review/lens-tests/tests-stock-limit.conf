# No CoinStock test runs a coin out of stock, so giveChange could hand out coins it does not have
# and the suite would still pass. The gap is real rather than planted: the lens reported it as
# Important in its first two runs, and it leaves the stock defect itself to the correctness lens,
# as its checklist says. (The Juice and Soda prices being untested came out Important once and
# Minor once, so it does not make a stable test.)
LENS=tests
RANGE=eval/spec-v2~1...eval/spec-v2
EXPECT_FILE='tests/Unit/Domain/Money/CoinStockTest.php|src/Domain/Money/CoinStock.php'
EXPECT_TEXT='runs out|run out|stock limit|exhaust|more coins than'
