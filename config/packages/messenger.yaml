framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                # The synchronous bus needs none of the default middleware, and the retry has to come
                # right before handle_message, which the defaults would keep apart.
                default_middleware: false
                middleware:
                    - 'App\Shared\Infrastructure\Symfony\Messenger\Middleware\UnpackExceptionMiddleware'
                    - 'App\Shared\Infrastructure\Symfony\Messenger\Middleware\RetryOnConcurrentUpdateMiddleware'
                    - 'handle_message'
            query.bus:
                middleware:
                    - 'App\Shared\Infrastructure\Symfony\Messenger\Middleware\UnpackExceptionMiddleware'
