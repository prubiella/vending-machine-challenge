monolog:
    channels:
        - deprecation

when@dev:
    monolog:
        handlers:
            stderr:
                type: stream
                path: "php://stderr"
                level: debug
                formatter: 'monolog.formatter.json'
                channels: [ "!event", "!messenger", "!console", "!doctrine", "!app" ]
            # The console prints the machine's output and its refusals on stdout and stderr, so the
            # application's own logs go to a file and only its warnings and errors join stderr.
            app_stderr:
                type: stream
                path: "php://stderr"
                level: warning
                formatter: 'monolog.formatter.json'
                channels: [ "app" ]
            app_file:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: debug
                formatter: 'monolog.formatter.json'
                channels: [ "app" ]

when@test:
    monolog:
        handlers:
            stderr:
                type: stream
                path: "php://stderr"
                level: warning
                formatter: 'monolog.formatter.json'
                channels: [ "!deprecation" ]

when@prod:
    monolog:
        handlers:
            stderr:
                type: stream
                path: "php://stderr"
                level: info
                formatter: 'monolog.formatter.json'
                channels: [ "!event", "!messenger", "!deprecation" ]
