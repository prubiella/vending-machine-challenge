parameters:
    # The one machine this installation runs: the default machine gets this id, and the repository
    # loads the machine stored under it. This is the only copy of the default: .env.dist leaves the
    # variable commented, and setting it there overrides the default.
    env(VENDING_MACHINE_ID): '01a1e2f0-aa80-70ea-832f-6110cbf86e31'
    vending_machine.id: '%env(VENDING_MACHINE_ID)%'
    vending_machine.default_products:
        - { selector: WATER, name: Water, price_cents: 65, units: 10 }
        - { selector: JUICE, name: Juice, price_cents: 100, units: 10 }
        - { selector: SODA, name: Soda, price_cents: 150, units: 10 }
    # The count of each coin by its cents.
    vending_machine.default_coin_stock: { 5: 10, 10: 10, 25: 10, 100: 0 }
    mongodb.database: '%env(MONGODB_DATABASE)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '%kernel.project_dir%/src/'
        exclude:
            - '%kernel.project_dir%/src/Kernel.php'
            - '%kernel.project_dir%/src/*/Domain/'
            - '%kernel.project_dir%/src/*/Application/Command/*/*Command.php'
            - '%kernel.project_dir%/src/*/Application/Query/*/*Query.php'
            - '%kernel.project_dir%/src/*/Application/Query/*/*Response.php'
            - '%kernel.project_dir%/src/*/Infrastructure/Controller/*Request.php'

    command_handlers:
        namespace: App\
        resource: '%kernel.project_dir%/src/*/Application/Command/**/*CommandHandler.php'
        tags: [ { name: messenger.message_handler, bus: command.bus } ]
        autoconfigure: false

    query_handlers:
        namespace: App\
        resource: '%kernel.project_dir%/src/*/Application/Query/**/*QueryHandler.php'
        tags: [ { name: messenger.message_handler, bus: query.bus } ]
        autoconfigure: false

    App\Shared\Infrastructure\Symfony\Messenger\Middleware\RetryOnConcurrentUpdateMiddleware:
        arguments:
            $maxRetries: 3

    MongoDB\Client:
        # Fail within 2 s instead of the driver's 30 s when mongo is down, so the readiness probe
        # and the requests answer.
        arguments: ['%env(MONGODB_URL)%', { serverSelectionTimeoutMS: 2000 }]

    MongoDB\Database:
        factory: ['@MongoDB\Client', 'getDatabase']
        arguments: ['%mongodb.database%']

    App\VendingMachine\Domain\MachineId:
        factory: ['App\VendingMachine\Domain\MachineId', fromString]
        arguments: ['%vending_machine.id%']

    App\VendingMachine\Infrastructure\Persistence\DefaultVendingMachineFactory:
        arguments:
            $products: '%vending_machine.default_products%'
            $coinStockByCents: '%vending_machine.default_coin_stock%'

    App\VendingMachine\Domain\VendingMachineRepository: '@App\VendingMachine\Infrastructure\Persistence\MongoVendingMachineRepository'

    App\VendingMachine\Infrastructure\CashBox\RememberingCashBoxCollectionLog:
        arguments:
            $log: '@App\VendingMachine\Infrastructure\CashBox\LoggerCashBoxCollectionLog'

    App\VendingMachine\Application\Command\ServiceMachine\CashBoxCollectionLog: '@App\VendingMachine\Infrastructure\CashBox\RememberingCashBoxCollectionLog'

    App\VendingMachine\Infrastructure\Persistence\StoredMachineResetter: '@App\VendingMachine\Infrastructure\Persistence\MongoVendingMachineRepository'
    App\VendingMachine\Infrastructure\Outbox\MachineOutbox: '@App\VendingMachine\Infrastructure\Persistence\MongoVendingMachineRepository'

    App\VendingMachine\Domain\Change\FewestCoinsChangeMaker:
        arguments:
            - !php/enum App\VendingMachine\Domain\Coin\Coin::FiveCents
            - !php/enum App\VendingMachine\Domain\Coin\Coin::TenCents
            - !php/enum App\VendingMachine\Domain\Coin\Coin::TwentyFiveCents

    App\VendingMachine\Domain\Change\ChangeMaker: '@App\VendingMachine\Domain\Change\FewestCoinsChangeMaker'

    App\VendingMachine\Infrastructure\Change\LoggingChangeMaker:
        decorates: App\VendingMachine\Domain\Change\ChangeMaker
        arguments:
            $changeMaker: '@.inner'

    App\Maintenance\Domain\Technician\TechnicianRepository: '@App\Maintenance\Infrastructure\Persistence\DbalTechnicianRepository'

    App\Maintenance\Domain\Technician\PasswordHasher: '@App\Maintenance\Infrastructure\Security\SymfonyPasswordHasher'

    Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher: ~

    Symfony\Component\PasswordHasher\PasswordHasherInterface: '@Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher'

when@test:
    parameters:
        mongodb.database: '%env(MONGODB_DATABASE)%_test'
    services:
        # The lowest bcrypt cost keeps the tests fast; the other environments use the hasher's default.
        Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher:
            arguments:
                $cost: 4
